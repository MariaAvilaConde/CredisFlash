<nav class="navbar">
  <div class="nav-container">

    <!-- Logo -->
    <a routerLink="/" class="nav-logo">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">CrediFlash</span>
    </a>

    <!-- Links: solo Inicio cuando no conectado; todo cuando conectado -->
    <div class="nav-links" [class.open]="menuOpen()">
      <a routerLink="/"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact:true}"
         class="nav-link"
         (click)="menuOpen.set(false)">
        Inicio
      </a>

      @if (web3.isConnected()) {
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link" (click)="menuOpen.set(false)">Dashboard</a>
        <a routerLink="/send"      routerLinkActive="active" class="nav-link" (click)="menuOpen.set(false)">Enviar</a>
        <a routerLink="/history"   routerLinkActive="active" class="nav-link" (click)="menuOpen.set(false)">Historial</a>
        <a routerLink="/networks"  routerLinkActive="active" class="nav-link" (click)="menuOpen.set(false)">Redes</a>
      }
    </div>

    <!-- Wallet area -->
    <div class="nav-wallet">
      @if (web3.isConnected()) {
        <div class="wallet-info">
          <div class="network-dot" [class.has-network]="web3.currentNetwork"></div>
          <span class="network-name">{{ web3.currentNetwork?.chainName ?? 'Red desconocida' }}</span>
          <div class="wallet-address" (click)="disconnect()" title="Click para desconectar">
            <span class="addr-icon">🦊</span>
            <span>{{ shortAddress(web3.account()) }}</span>
          </div>
        </div>
      } @else {
        <button class="btn-connect" (click)="openModal()" [disabled]="web3.isLoading()">
          @if (web3.isLoading()) {
            <span class="spinner"></span>
          } @else {
            <span>🔐</span>
          }
          Conectar Wallet
        </button>
      }
    </div>

    <!-- Hamburger -->
    <button class="hamburger" (click)="toggleMenu()" aria-label="Menú">
      <span [class.open]="menuOpen()"></span>
      <span [class.open]="menuOpen()"></span>
      <span [class.open]="menuOpen()"></span>
    </button>
  </div>
</nav>
